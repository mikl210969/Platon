# Конфигурация платформы PLATO V2

bybit:
  use_testnet: false
  use_demo: true
  
  # URL выбирается автоматически на основе флагов выше
  # testnet: https://api-testnet.bybit.com
  # demo: https://api-demo.bybit.com
  # mainnet: https://api.bybit.com

trading:
  symbols: ["SOLUSDT", "LINKUSDT", "ETHUSDT"] # Мультивалютность v1.0
  category: "linear"
  
  exit_logic: "structure"
  
  # ✅ ПОЛНЫЙ РАЗДЕЛ: Валидация структуры и Умный TP2
  structure_validation:
    wall_volume_multiple: 1.0          # ⚠️ ВРЕМЕННО: Было 4.0. Снижено до 3.0 для E2E теста пайплайна.
    wall_baseline_bars: 28             # Окно для расчёта медианы объёма
    min_retracement_atr_multiplier: 1.5 # Минимальный откат 1.5 × ATR(5m)
    
    # 🔑 РАЗДЕЛЬНЫЕ ТАЙМЕРЫ (физика рынка):
    departure_max_bars: 24             # Время на поиск ОТКАТА (до 2 часов). Если цена не ушла — зона протухла.
    return_max_bars: 24                # Время на ВОЗВРАТ после отката (до 2 часов). Откат быстрый, возврат тоже должен быть быстрым.
    
    sl_buffer_atr5m: 1.0               # Буфер SL = 1.0 × ATR(5m) от экстремума
    tp1_risk_multiple: 1.5             # TP1 = entry ± (risk_dist × 1.5)
    tp2_risk_multiple: 3.0             # TP2 = entry ± (risk_dist × 3.0)
    post_tp1_logic: "tp2_protect"      # Логика после TP1 (перенос SL на TP2 + буфер)
    tp2_protection_buffer_mult: 3.0    # Множитель для расчёта буфера комиссий
    commission_rate: 0.0004            # 0.04% (комиссия Bybit)
  
  risk:
    base_risk_usdt: 30.0
    max_position_size: 10.0
    max_daily_loss: 100.0
  
  orders:
    breakeven_after_tp1: false         # Отключено, так как работает post_tp1_logic
    planned_size: 10.0                 # Для динамического сайзинга
    order_ttl_seconds: 120             # Умный таймер

# ✅ СПЕЦИФИЧЕСКИЕ ПАРАМЕТРЫ ПО ИНСТРУМЕНТАМ
instruments:
  SOLUSDT:
    enabled: true
    min_wall_value_usd: 50000          # LOCKED: Работает как есть
    
  LINKUSDT:
    enabled: true
    min_wall_value_usd: 80000          # ADD: Звезда шоу (+22%, PF 3.75)
    
  ETHUSDT:
    enabled: true
    min_wall_value_usd: 120000         # TUNE: Снижено с 200k для увеличения потока
    
  BTCUSDT:
    enabled: false                     # DROP: Нет edge на L1
    
  BNBUSDT:
    enabled: false                     # TEST: Ждем данных
    min_wall_value_usd: 120000
    
  AVAXUSDT:
    enabled: false                     # TEST: Ждем данных
    min_wall_value_usd: 60000

self_test:
  enabled: false
  interval_seconds: 120
  test_order_qty: 7.0
  test_order_price_offset_percent: 10.0

logging:
  level: "INFO"
  file: "plato.log"

system:
  startup_test: "none"
  test_trades_count: 10
  signal_source: "off"                 # "off" = только сбор данных и реальные сигналы
  shadow_mode: false                   # false = боевой режим (ордера улетают на демо-биржу)