# Конфигурация платформы PLATO V2
# Версия: Golden Bounce & Retest (v3.4 Cluster SL + Aggressive Entry)
# Обновлено: пороги стен по бэктесту + entry_offset_ticks=6

bybit:
  use_testnet: false
  use_demo: true

trading:
  filters:
    positive_ev:
      safety_margin: 1.2

  symbols: ["SOLUSDT", "BTCUSDT", "AVAXUSDT", "BNBUSDT", "XRPUSDT", "ETHUSDT", "LINKUSDT"]
  category: "linear"
  exit_logic: "structure"
  
  structure_validation:
    wall_volume_multiple: 1.5
    wall_baseline_bars: 28
    min_retracement_atr_multiplier: 1.5
    departure_max_bars: 24
    return_max_bars: 24
    post_tp1_logic: "tp2_protect"
    tp2_protection_buffer_mult: 3.0
  
  risk:
    base_risk_usdt: 30.0
    max_notional_usd: 50000.0
    min_notional_usd: 100.0
    max_daily_loss: 100.0
  
  swing_sl:
    enabled: true
    swing_n: 5
    swing_window: 48
    sl_buffer_atr_mult: 0.5
    tp1_mult: 1.0
    tp2_mult: 2.0
    early_be_fraction: 0.5
  
  cluster_search:
    enabled: true
    k_median: 4
    break_coefficient: 3.0
    quick_signal_coefficient: 2.0
    min_liquid_levels: 3
    min_liquid_width_ticks: 5
    max_liquid_volume_pct: 0.10
    max_depth_atr_mult: 0.3
    max_depth_price_pct: 0.0005

  cluster_sl:
    enabled: true
    buffer_atr_mult: 0.1
    buffer_min_ticks: 3
    buffer_cold_start_ticks: 5
    max_distance_atr_mult: 2.0
    use_hvn_validation: true
    hvn_max_age_sec: 1800
    hvn_match_tolerance_ticks: 10
    tp_buffer_ticks: 3

  instrument_filters:
    BTCUSDT: { type: return_bars_max, threshold: 6 }
    XRPUSDT: { type: delta_agree, threshold: 50 }
    SOLUSDT: { type: return_bars_max, threshold: 6 }
    BNBUSDT: { type: return_bars_max, threshold: 6 }
    AVAXUSDT: { type: return_bars_max, threshold: 6 }
    ETHUSDT: { type: return_bars_max, threshold: 6 }
    LINKUSDT: { type: return_bars_max, threshold: 6 }
  
  orders:
    breakeven_after_tp1: false
    planned_size: 10.0
    order_ttl_seconds: 120

  strategies:
    golden_bounce:
      risk_management:
        min_rr_ratio: 1.0
        risk_slippage_mult: 1.2
        fee_rate: 0.0004
        entry_offset_ticks: 6  # ✅ Компромисс: было 4, стало 6 (баланс fill%/цены входа)

      session_multipliers:
        asian_night: { k_wall: 2.5, k_atr_sl_buffer: 1.0, k_atr_retracement: 1.2, k_delta: 0.8 }
        asian: { k_wall: 2.0, k_atr_sl_buffer: 1.0, k_atr_retracement: 1.5, k_delta: 1.0 }
        european: { k_wall: 1.8, k_atr_sl_buffer: 1.2, k_atr_retracement: 1.5, k_delta: 1.2 }
        american: { k_wall: 1.5, k_atr_sl_buffer: 1.5, k_atr_retracement: 1.5, k_delta: 1.5 }

      regime_shift:
        min_atr_ratio: 0.3
        max_atr_ratio: 3.0

      health:
        min_atr_bps: 20
        dead_market_hysteresis_sec: 600
        zone_dedup_atr_mult: 1.5
        zone_dedup_min_pct: 0.001
        signal_cooldown_sec: 300
        max_active_per_symbol: 1
        max_zone_age_sec: 172800
        max_passports_per_hour: 10
        max_zones_per_hour: 60
        entry_order_ttl_sec: 600
        min_departure_atr_mult: 0.8
        wall_broken_atr_mult: 0.1

      wall_persistence:
        min_consecutive_ticks: 2
        detect_window_sec: 1.0
        same_wall_price_tolerance_ticks: 5
        min_wall_duration_sec: 2.0
        half_life_sec: 25
        partial_fill_min_ratio: 0.25
        min_timeout_sec: 3
        max_timeout_sec: 8
        tape_window_ms: 400
        tape_price_tolerance_ticks: 3
        refill_ttl_sec: 60
        refill_boost_per_event: 0.25
        refill_boost_max: 2.0
        pull_cycle_demerit: 0.5
        max_pull_cycles: 3

# ✅ Пороги стен по бэктесту (между P90 и P95, с запасом для демо)
instruments:
  SOLUSDT:
    enabled: true
    min_wall_value_usd: 30000    # было 150000 (P90=22699, P95=42293)
    min_cluster_volume_usd: 15000
  BTCUSDT:
    enabled: true
    min_wall_value_usd: 100000   # было 150000 (P90=93404, P95=123753)
    min_cluster_volume_usd: 50000
  XRPUSDT:
    enabled: true
    min_wall_value_usd: 10000    # было 40000 (P90=6988, P95=10254)
    min_cluster_volume_usd: 5000
  BNBUSDT:
    enabled: true
    min_wall_value_usd: 3000     # было 100000 (P90=1064, P95=1791)
    min_cluster_volume_usd: 1500
  AVAXUSDT:
    enabled: true
    min_wall_value_usd: 1500     # было 70000 (P90=369, P95=740)
    min_cluster_volume_usd: 800
  ETHUSDT:
    enabled: true
    min_wall_value_usd: 25000    # НОВЫЙ (P90=17080, P95=24234)
    min_cluster_volume_usd: 12000
  LINKUSDT:
    enabled: true
    min_wall_value_usd: 1500     # НОВЫЙ (P90=494, P95=997)
    min_cluster_volume_usd: 800

self_test:
  enabled: false
  interval_seconds: 120
  test_order_qty: 7.0
  test_order_price_offset_percent: 10.0

logging:
  level: "INFO"
  file: "plato.log"

system:
  startup_test: "none"
  test_trades_count: 10
  signal_source: "off"
  shadow_mode: false