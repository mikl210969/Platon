# Конфигурация платформы PLATO V2
# Версия: Golden Bounce & Retest (v3.4 Cluster SL Shadow Mode)
# Обновлено: инструмент-специфичные фильтры + Swing SL + early_BE + кластерный SL (shadow)

bybit:
  use_testnet: false
  use_demo: true  # Включаем демо-счет для безопасного тестирования

trading:
  filters:
    positive_ev:
      safety_margin: 1.2

  # ✅ Изменено: убрали ETHUSDT и LINKUSDT, добавили XRPUSDT
  symbols: ["SOLUSDT", "BTCUSDT", "AVAXUSDT", "BNBUSDT", "XRPUSDT"]
  category: "linear"
  exit_logic: "structure"
  
  structure_validation:
    wall_volume_multiple: 1.5
    wall_baseline_bars: 28
    min_retracement_atr_multiplier: 1.5
    departure_max_bars: 24
    return_max_bars: 24
    post_tp1_logic: "tp2_protect"
    tp2_protection_buffer_mult: 3.0
  
  # ✅ ЕДИНАЯ ВАЛЮТА РИСКА: USDT
  risk:
    base_risk_usdt: 30.0         # Ровно 30$ риска на сделку (адаптируется через size)
    max_notional_usd: 50000.0    # Максимальный размер позиции в USDT
    min_notional_usd: 100.0      # Минимальный размер позиции в USDT
    max_daily_loss: 100.0        # Лимит дневных потерь в USDT
  
  # ✅ Swing SL параметры (протестировано с PF 2.07)
  swing_sl:
    enabled: true
    swing_n: 5                    # Бары слева/справа для определения Swing
    swing_window: 48              # Окно поиска Swing (баров)
    sl_buffer_atr_mult: 0.5       # Буфер от Swing в ATR
    tp1_mult: 1.0                 # TP1 = 1.0 × SL_distance
    tp2_mult: 2.0                 # TP2 = 2.0 × SL_distance
    early_be_fraction: 0.5        # BE = 50% пути к TP1 (early_BE)
  
  # ✅ НОВАЯ СЕКЦИЯ: Кластерный SL (v3.4, shadow-режим)
  cluster_search:
    enabled: true
    k_median: 4                   # Размер окна для медианы объёмов
    break_coefficient: 3.0        # Коэффициент разрыва относительно медианы
    quick_signal_coefficient: 2.0 # Коэффициент быстрого сигнала (относительно соседа)
    min_liquid_levels: 3          # Минимум жидких уровней для подтверждения разрыва
    min_liquid_width_ticks: 5     # Минимальная ширина жидкой зоны в тиках
    max_liquid_volume_pct: 0.10   # Максимальный объём жидкой зоны (% от кластера)
    max_depth_atr_mult: 0.3       # Потолок сканирования в ATR
    max_depth_price_pct: 0.0005   # Потолок сканирования в % от цены

  cluster_sl:
    enabled: true               # ← МЕНЯЕМ НА TRUE (Боевой режим)
    buffer_atr_mult: 0.1
    buffer_min_ticks: 3
    buffer_cold_start_ticks: 5
    max_distance_atr_mult: 2.0
    use_hvn_validation: true
    hvn_max_age_sec: 1800
    hvn_match_tolerance_ticks: 10
    tp_buffer_ticks: 3

  # ✅ Инструмент-специфичные фильтры возврата
  instrument_filters:
    BTCUSDT: { type: return_bars_max, threshold: 6 }   # PF 1.70 на BTC
    XRPUSDT: { type: delta_agree, threshold: 50 }      # PF 3.52 на XRP
    SOLUSDT: { type: return_bars_max, threshold: 6 }   # PF 1.35 на SOL
    BNBUSDT: { type: return_bars_max, threshold: 6 }   # дефолт
    AVAXUSDT: { type: return_bars_max, threshold: 6 }  # дефолт
  
  orders:
    breakeven_after_tp1: false
    planned_size: 10.0           # Устарело, теперь управляется через base_risk_usdt
    order_ttl_seconds: 120

  strategies:
    golden_bounce:
      risk_management:
        min_rr_ratio: 1.0
        risk_slippage_mult: 1.2
        fee_rate: 0.0004
        entry_offset_ticks: 1  

      session_multipliers:
        asian_night: { k_wall: 2.5, k_atr_sl_buffer: 1.0, k_atr_retracement: 1.2, k_delta: 0.8 }
        asian: { k_wall: 2.0, k_atr_sl_buffer: 1.0, k_atr_retracement: 1.5, k_delta: 1.0 }
        european: { k_wall: 1.8, k_atr_sl_buffer: 1.2, k_atr_retracement: 1.5, k_delta: 1.2 }
        american: { k_wall: 1.5, k_atr_sl_buffer: 1.5, k_atr_retracement: 1.5, k_delta: 1.5 }

      regime_shift:
        min_atr_ratio: 0.3
        max_atr_ratio: 3.0

      health:
        min_atr_bps: 20
        dead_market_hysteresis_sec: 600
        zone_dedup_atr_mult: 1.5
        zone_dedup_min_pct: 0.001
        signal_cooldown_sec: 300
        max_active_per_symbol: 1
        max_zone_age_sec: 172800
        max_passports_per_hour: 10
        max_zones_per_hour: 60
        entry_order_ttl_sec: 600
        min_departure_atr_mult: 0.8
        wall_broken_atr_mult: 0.1

      wall_persistence:
        min_consecutive_ticks: 2
        detect_window_sec: 1.0
        same_wall_price_tolerance_ticks: 5
        min_wall_duration_sec: 2.0
        half_life_sec: 25
        partial_fill_min_ratio: 0.25
        min_timeout_sec: 3
        max_timeout_sec: 8
        tape_window_ms: 400
        tape_price_tolerance_ticks: 3
        refill_ttl_sec: 60
        refill_boost_per_event: 0.25
        refill_boost_max: 2.0
        pull_cycle_demerit: 0.5
        max_pull_cycles: 3

# ✅ Настройки под каждый инструмент (в USDT)
# Изменено: убрали ETHUSDT и LINKUSDT, добавили XRPUSDT + min_cluster_volume_usd
instruments:
  SOLUSDT:
    enabled: true
    min_wall_value_usd: 150000
    min_cluster_volume_usd: 20000
  BTCUSDT:
    enabled: true
    min_wall_value_usd: 150000
    min_cluster_volume_usd: 50000
  XRPUSDT:
    enabled: true
    min_wall_value_usd: 40000
    min_cluster_volume_usd: 10000
  BNBUSDT:
    enabled: true
    min_wall_value_usd: 100000
    min_cluster_volume_usd: 20000
  AVAXUSDT:
    enabled: true
    min_wall_value_usd: 70000
    min_cluster_volume_usd: 10000

self_test:
  enabled: false
  interval_seconds: 120
  test_order_qty: 7.0
  test_order_price_offset_percent: 10.0

logging:
  level: "INFO"
  file: "plato.log"

system:
  startup_test: "none"
  test_trades_count: 10
  signal_source: "off"
  shadow_mode: false