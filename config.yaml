# Конфигурация платформы PLATO V2

bybit:
  use_testnet: false
  use_demo: true

trading:
  filters:
    positive_ev:
      safety_margin: 1.2  # ✅ СНИЖЕНО с 1.5 до 1.2 (Вариант Б)
  symbols: ["SOLUSDT", "LINKUSDT", "ETHUSDT", "BTCUSDT", "BNBUSDT", "AVAXUSDT"]  # ✅ ДОБАВЛЕНЫ 3 символа
  category: "linear"
  
  exit_logic: "structure"
  
  structure_validation:
    wall_volume_multiple: 1.5
    wall_baseline_bars: 28
    min_retracement_atr_multiplier: 1.5
    departure_max_bars: 24
    return_max_bars: 24
    sl_buffer_atr5m: 1.0
    tp1_risk_multiple: 1.5
    tp2_risk_multiple: 3.0
    post_tp1_logic: "tp2_protect"
    tp2_protection_buffer_mult: 3.0
    commission_rate: 0.0004
  
  risk:
    base_risk_usdt: 30.0
    max_position_size: 10.0
    max_daily_loss: 100.0
  
  orders:
    breakeven_after_tp1: false
    planned_size: 10.0
    order_ttl_seconds: 120

  strategies:
    golden_bounce:
      session_multipliers:
        asian_night:
          k_wall: 2.5
          k_atr_sl_buffer: 1.0
          k_atr_retracement: 1.2
          k_delta: 0.8
        asian:
          k_wall: 2.0
          k_atr_sl_buffer: 1.0
          k_atr_retracement: 1.5
          k_delta: 1.0
        european:
          k_wall: 1.8
          k_atr_sl_buffer: 1.2
          k_atr_retracement: 1.5
          k_delta: 1.2
        american:
          k_wall: 1.5
          k_atr_sl_buffer: 1.5
          k_atr_retracement: 1.5
          k_delta: 1.5

      regime_shift:
        min_atr_ratio: 0.5
        max_atr_ratio: 2.0

      health:
        min_atr_bps: 20
        dead_market_hysteresis_sec: 600
        zone_dedup_atr_mult: 1.5
        zone_dedup_min_pct: 0.001
        signal_cooldown_sec: 300
        max_active_per_symbol: 1
        max_zone_age_sec: 1200
        max_passports_per_hour: 10
        max_zones_per_hour: 60
        entry_order_ttl_sec: 600

      wall_persistence:
        min_consecutive_ticks: 2
        detect_window_sec: 1.0
        same_wall_price_tolerance_ticks: 5
        min_wall_duration_sec: 2.0
        half_life_sec: 25
        partial_fill_min_ratio: 0.25
        min_timeout_sec: 3
        max_timeout_sec: 8
        tape_window_ms: 400
        tape_price_tolerance_ticks: 3
        refill_ttl_sec: 60
        refill_boost_per_event: 0.25
        refill_boost_max: 2.0
        pull_cycle_demerit: 0.5
        max_pull_cycles: 3

      entry_offset_ticks: 2

instruments:
  SOLUSDT:
    enabled: true
    min_wall_value_usd: 50000
    
  LINKUSDT:
    enabled: true
    min_wall_value_usd: 80000
    
  ETHUSDT:
    enabled: true
    min_wall_value_usd: 120000
    
  BTCUSDT:
    enabled: true
    min_wall_value_usd: 300000
    
  BNBUSDT:
    enabled: true
    min_wall_value_usd: 60000
    
  AVAXUSDT:
    enabled: true
    min_wall_value_usd: 60000

self_test:
  enabled: false
  interval_seconds: 120
  test_order_qty: 7.0
  test_order_price_offset_percent: 10.0

logging:
  level: "INFO"
  file: "plato.log"

system:
  startup_test: "none"
  test_trades_count: 10
  signal_source: "off"
  shadow_mode: false